<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400 M 0 500 L 800 500" />
    <path d="M 100 0 L 100 600 M 200 0 L 200 600 M 300 0 L 300 600 M 400 0 L 400 600 M 500 0 L 500 600 M 600 0 L 600 600 M 700 0 L 700 600" />
  </g>

  <!-- Next.js/React Window -->
  <g transform="translate(50, 50)">
    <rect width="700" height="450" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Window Header -->
    <rect width="700" height="40" rx="12" fill="#0f172a" />
    <circle cx="25" cy="20" r="6" fill="#ef4444" />
    <circle cx="45" cy="20" r="6" fill="#eab308" />
    <circle cx="65" cy="20" r="6" fill="#22c55e" />
    <text x="350" y="25" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">ricksy-store - Next.js App Router</text>
    
    <!-- Code Editor Area -->
    <g transform="translate(30, 80)">
      <!-- Prisma Schema block -->
      <rect width="300" height="320" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">model Product {</text>
      <text x="35" y="55" fill="#94a3b8" font-family="monospace" font-size="13">id          String   <tspan fill="#a78bfa">@id</tspan></text>
      <text x="35" y="75" fill="#94a3b8" font-family="monospace" font-size="13">name        String</text>
      <text x="35" y="95" fill="#94a3b8" font-family="monospace" font-size="13">slug        String   <tspan fill="#a78bfa">@unique</tspan></text>
      <text x="35" y="115" fill="#94a3b8" font-family="monospace" font-size="13">price       Float</text>
      <text x="35" y="135" fill="#94a3b8" font-family="monospace" font-size="13">category    Category</text>
      <text x="35" y="155" fill="#94a3b8" font-family="monospace" font-size="13">variants    ProductVariant[]</text>
      <text x="35" y="175" fill="#94a3b8" font-family="monospace" font-size="13">isPublished Boolean  <tspan fill="#f472b6">@default</tspan>(true)</text>
      <text x="20" y="200" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">}</text>

      <text x="20" y="240" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">model Order {</text>
      <text x="35" y="265" fill="#94a3b8" font-family="monospace" font-size="13">status      String   <tspan fill="#f472b6">@default</tspan>("PENDING")</text>
      <text x="35" y="285" fill="#94a3b8" font-family="monospace" font-size="13">total       Float</text>
      <text x="20" y="310" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">}</text>
    </g>

    <!-- Architecture / Visual representation -->
    <g transform="translate(360, 80)">
      <rect width="310" height="320" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Tech Stack Nodes -->
      <!-- Next.js Node -->
      <rect x="105" y="40" width="100" height="40" rx="6" fill="#ffffff" />
      <text x="155" y="65" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Next.js</text>
      
      <!-- Auth Node -->
      <rect x="40" y="120" width="100" height="40" rx="6" fill="#8b5cf6" />
      <text x="90" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NextAuth.js</text>
      
      <!-- Tailwind/UI Node -->
      <rect x="170" y="120" width="100" height="40" rx="6" fill="#0ea5e9" />
      <text x="220" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TailwindCSS</text>

      <!-- Prisma Node -->
      <rect x="105" y="200" width="100" height="40" rx="6" fill="#10b981" />
      <text x="155" y="225" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Prisma ORM</text>

      <!-- DB Node -->
      <rect x="105" y="280" width="100" height="40" rx="6" fill="#3b82f6" />
      <text x="155" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL</text>

      <!-- Connecting Lines -->
      <path d="M 155 80 L 155 200" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
      <path d="M 120 80 L 90 120" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
      <path d="M 190 80 L 220 120" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
      <path d="M 155 240 L 155 280" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    </g>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="110" height="30" rx="15" fill="#ffffff" />
    <text x="55" y="20" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Next.js 15</text>
    
    <rect x="120" y="0" width="110" height="30" rx="15" fill="#10b981" />
    <text x="175" y="20" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Prisma</text>

    <rect x="240" y="0" width="140" height="30" rx="15" fill="#3b82f6" />
    <text x="310" y="20" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PostgreSQL</text>
    
    <rect x="390" y="0" width="120" height="30" rx="15" fill="#0ea5e9" />
    <text x="450" y="20" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TailwindCSS</text>
  </g>
</svg>
