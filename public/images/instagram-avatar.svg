<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#microGrid)"/>

  <!-- Subtle Circular Framing Guide for Instagram crop -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="512" cy="512" r="320" fill="#111827" fill-opacity="0.6" stroke="#374151" stroke-width="1.5"/>

  <!-- Precision Corner Alignment Marks -->
  <path d="M 280 320 L 280 280 L 320 280" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 744 320 L 744 280 L 704 280" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 280 704 L 280 744 L 320 744" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 744 704 L 744 744 L 704 744" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Crosshairs -->
  <line x1="512" y1="210" x2="512" y2="240" stroke="#4b5563" stroke-width="2"/>
  <line x1="512" y1="784" x2="512" y2="814" stroke="#4b5563" stroke-width="2"/>
  <line x1="210" y1="512" x2="240" y2="512" stroke="#4b5563" stroke-width="2"/>
  <line x1="784" y1="512" x2="814" y2="512" stroke="#4b5563" stroke-width="2"/>

  <!-- Bold Monogram -->
  <text x="512" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="180" font-weight="bold" fill="#f9fafb" text-anchor="middle" letter-spacing="-6">RA</text>

  <!-- Technical Subtext -->
  <text x="512" y="690" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="6">SOFTWARE ENGINEER</text>

  <!-- Active Status Indicator Dot -->
  <circle cx="700" cy="340" r="14" fill="#10b981"/>
  <circle cx="700" cy="340" r="22" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
