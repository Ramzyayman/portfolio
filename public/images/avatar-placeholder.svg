<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#374151" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <rect width="400" height="400" rx="32" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="4" y="4" width="392" height="392" rx="28" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 370 50 L 370 30 L 350 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 30 350 L 30 370 L 50 370" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 370 350 L 370 370 L 350 370" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Circle Target -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="200" cy="200" r="60" fill="#1f2937" fill-opacity="0.5" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Monogram Initials -->
  <text x="200" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="56" font-weight="bold" fill="#f3f4f6" text-anchor="middle" letter-spacing="-2">RA</text>

  <!-- Technical Labels -->
  <text x="200" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="3">ENGINEER // CAIRO, EG</text>
  <text x="200" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="1">PHOTO ASSET PLACEHOLDER</text>
</svg>
