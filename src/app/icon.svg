<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="32" height="32" rx="7" fill="url(#iconBg)"/>
  
  <!-- Subtle Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Monogram Initials -->
  <text x="16" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">RA</text>

  <!-- Active Status Dot -->
  <circle cx="25" cy="7" r="2" fill="#10b981"/>
</svg>
