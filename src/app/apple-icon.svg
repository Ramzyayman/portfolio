<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="180" height="180" rx="36" fill="url(#appleIconBg)"/>
  
  <!-- Subtle Border -->
  <rect x="4" y="4" width="172" height="172" rx="32" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.8"/>

  <!-- Monogram Initials -->
  <text x="90" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="76" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">RA</text>

  <!-- Active Status Dot -->
  <circle cx="140" cy="40" r="10" fill="#10b981"/>
</svg>
